<!DOCTYPE html>
<html lang="et">
    <head>
        <title>Harjutus 6 Ott</title>
        <link rel="shortcut icon" href="favico.png" />
        <meta name="description" content="Oleme Mario tunnis" />
        <meta name="keywords" content="HTML, HTML5" />
        <meta name="author" content="Ott Tammik IT-23" />
        <meta charset="UTF-8" />
    </head>
<body>
    <form method="get" action="#">
    <table>
            <tr>
                <td>Kasutajanimi:</td>
                <td><input type="text" name="Kasutajanimi" maxlength="6" placeholder="max pikkus 6" required></td>
            </tr>
            <tr>
                <td>Kursus:</td>
                <td><input type="text" name="Kursus" maxlength="3" placeholder="max pikkus 3" required></td>
            </tr>
            <tr>
                <td><label>Osakonna number: </label></td>
                <td><input type="number" value="1" min="1" max="5" step="0.5"></td>
            </tr>
            <tr>
                <td>Parool:</td>
                <td><input type="text" name="Kasutajanimi" required></td>
            </tr>
            <tr>
                <td>Vali teenus:</td>
                <td><select>
                        <optgroup label="Odav">
                            <option value="oda">0.99€</option>
                        </optgroup>
                        <optgroup label="Kallis">
                            <option value="kal">2.99€</option>
                        </optgroup>
                    </select></td>
            </tr>
            <tr>
                <td>Roll:</td>
                <td><input type="radio" name="roll" value="pun">Admin<br>
                    <input type="radio" name="roll" value="sin">Modearaator<br>
                    <input type="radio" name="roll" value="kol">User<br>
                </td>
            </tr>
            <tr>
                <td>Nõustun tingimustega:</td>
                <td><input type="checkbox" name="Nõustun" value="lil"></td>
            </tr>
            <tr>
                <td>Enesetutvustus:</td>
                <td><textarea rows="20" cols="50">Siia pikem tekst</textarea><br></td>
            </tr>
            <tr>
                <td><input type="reset" value="Tühjenda väljad">
                <td><input type="submit" value="Saada"></td>
            </tr>

    </table>
</form>
</body>
</html>
